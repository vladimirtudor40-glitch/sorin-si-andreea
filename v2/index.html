<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorin & Andreea</title>
<meta name="description" content="Lista invitaților la nunta lui Sorin și a Andreei">
<meta name="theme-color" content="#0A0908">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Cormorant', 'Georgia', 'serif'],
          sans: ['Montserrat', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        colors: {
          bg: 'var(--bg)', surface: 'var(--surface)', ink: 'var(--ink)', muted: 'var(--muted)',
          gold: 'var(--gold)', line: 'var(--line)', ok: 'var(--ok)',
        },
      },
    },
  };
</script>
<style>
  :root {
    --bg: #0A0908; --surface: #131110; --surface-2: #1A1714; --ink: #F5EEE0; --muted: #A89E8C;
    --gold: #D9B868; --gold-hi: #F5E3AE; --gold-lo: #9A7A30; --line: rgba(217,184,104,.16); --ok: #7CCFB0;
    color-scheme: dark;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: Montserrat, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--gold); color: var(--bg); }
  :focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; }

  .gold {
    background: linear-gradient(100deg, var(--gold-lo) 0%, var(--gold) 30%, var(--gold-hi) 50%, var(--gold) 70%, var(--gold-lo) 100%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 7s ease-in-out infinite;
  }
  @keyframes shimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
  .gold-fill { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); }
  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  .grid-bg {
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px; opacity: .35;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
  }
  .caret { display: inline-block; width: .5em; height: 1.1em; background: var(--gold); vertical-align: -.2em; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .cartouche { display: grid; place-items: center; width: 44px; height: 60px; border-radius: 22px; border: 1px solid var(--gold); position: relative;
               font-family: Cormorant, serif; font-weight: 600; font-size: 1.05rem; color: var(--gold); }
  .cartouche::after { content: ""; position: absolute; bottom: -6px; left: 9px; right: 9px; height: 1px; background: var(--gold); }
  .cartouche.on { border-color: transparent; color: var(--bg); }
  .scroller { scrollbar-width: none; } .scroller::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .gold, .caret { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?deps=react@18.3.1,react-dom@18.3.1",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
</head>
<body>
<div id="root"></div>

<script type="module">
import React, { useState, useEffect, useMemo, useRef, useDeferredValue } from 'react';
import { createRoot } from 'react-dom/client';
import {
  motion, AnimatePresence, MotionConfig, useScroll, useTransform, useMotionValue,
  useMotionTemplate, useSpring, useInView, animate,
} from 'framer-motion';
import htm from 'htm';
import { FALLBACK_CSV } from './fallback.js';

const html = htm.bind(React.createElement);
const EASE = [0.2, 0.8, 0.2, 1];

/* ---------------- data ---------------- */

const SHEET_ID = '1g3XAW7J8n8-O9wjjTopZuY8imCQQJnFaStiv3aTssQE';
const LIVE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0&headers=1`;

const GROUP_LABELS = {
  'familie andreea': 'Familia Andreei',
  'munca andreea': 'Colegii Andreei',
  'familie sorin': 'Familia lui Sorin',
  'munca sorin': 'Colegii lui Sorin',
  'prieteni comuni': 'Prieteni comuni',
};

function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function toGuests(rows) {
  const guests = []; let group = '';
  for (const r of rows.slice(1)) {
    const [g = '', note = '', name = '', comp = '', kids = '', sent = '', conf = ''] = r.map(v => (v || '').trim());
    if (note.toUpperCase() === 'TOTAL') break;
    if (g) group = g;
    if (!name) continue;
    guests.push({
      id: guests.length,
      group: GROUP_LABELS[group.toLowerCase()] || group,
      note, name,
      companions: parseInt(comp, 10) || 0,
      kids: parseInt(kids, 10) || 0,
      sent: sent.toUpperCase() === 'DA',
      confirmed: conf.toUpperCase() === 'DA',
    });
  }
  return guests;
}

function useGuests() {
  const [state, setState] = useState({ guests: [], live: null });
  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(LIVE_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        const guests = toGuests(parseCSV(await res.text()));
        if (!guests.length) throw new Error('empty');
        setState({ guests, live: true });
      } catch {
        setState({ guests: toGuests(parseCSV(FALLBACK_CSV)), live: false });
      }
    })();
  }, []);
  return state;
}

const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const initials = n => n.split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const sum = (list, k) => list.reduce((a, g) => a + g[k], 0);
function groupsOf(list) {
  const m = new Map();
  for (const g of list) { if (!m.has(g.group)) m.set(g.group, []); m.get(g.group).push(g); }
  return [...m];
}

/* ---------------- primitives ---------------- */

function Reveal({ children, delay = 0, className = '' }) {
  return html`<${motion.div} className=${className}
    initial=${{ opacity: 0, y: 40 }} whileInView=${{ opacity: 1, y: 0 }}
    viewport=${{ once: true, margin: '-80px' }} transition=${{ duration: 0.9, ease: EASE, delay }}>${children}<//>`;
}

function Counter({ value, className = '' }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true });
  useEffect(() => {
    if (!inView) return;
    const ctl = animate(0, value, { duration: 1.8, ease: EASE, onUpdate: v => { if (ref.current) ref.current.textContent = Math.round(v); } });
    return () => ctl.stop();
  }, [inView, value]);
  return html`<span ref=${ref} className=${'tabular-nums ' + className}>0</span>`;
}

function Letters({ text, delay = 0, className = '' }) {
  return html`<span className=${'inline-flex ' + className} aria-label=${text}>
    ${[...text].map((ch, i) => html`
      <span key=${i} className="inline-block overflow-hidden pb-[.08em] -mb-[.08em]" aria-hidden="true">
        <${motion.span} className="inline-block gold"
          initial=${{ y: '105%', opacity: 0 }} animate=${{ y: 0, opacity: 1 }}
          transition=${{ duration: 1.1, ease: EASE, delay: delay + i * 0.07 }}>${ch}<//>
      </span>`)}
  </span>`;
}

function Typed({ text, delay = 0 }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    let id;
    const start = setTimeout(() => { id = setInterval(() => setN(v => (v >= text.length ? (clearInterval(id), v) : v + 1)), 38); }, delay * 1000);
    return () => { clearTimeout(start); clearInterval(id); };
  }, [text, delay]);
  return html`<span>${text.slice(0, n)}<span className="caret" aria-hidden="true"></span></span>`;
}

function Wave({ bars = 44, className = '' }) {
  return html`<div className=${'flex items-center justify-center gap-[3px] h-10 ' + className} aria-hidden="true">
    ${Array.from({ length: bars }, (_, i) => {
      const peak = 0.35 + Math.abs(Math.sin(i * 0.45)) * 0.65;
      return html`<${motion.span} key=${i} className="block w-[2px] h-full rounded-full gold-fill origin-center"
        initial=${{ scaleY: 0.08 }}
        animate=${{ scaleY: [0.12, peak, 0.25, peak * 0.8, 0.12] }}
        transition=${{ duration: 2.4 + (i % 5) * 0.3, repeat: Infinity, ease: 'easeInOut', delay: 1.6 + i * 0.03 }} />`;
    })}
  </div>`;
}

const ICONS = {
  check: html`<path d="M20 6 9 17l-5-5"/>`,
  plus: html`<path d="M12 5v14M5 12h14"/>`,
  child: html`<circle cx="12" cy="8" r="4"/><path d="M6 21c0-3.3 2.7-6 6-6s6 2.7 6 6"/>`,
  mail: html`<rect x="2" y="4" width="20" height="16"/><path d="m22 6-10 7L2 6"/>`,
  search: html`<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>`,
  down: html`<path d="M12 4v16M5 13l7 7 7-7"/>`,
};
const Icon = ({ name, size = 14 }) => html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${ICONS[name]}</svg>`;

/* ---------------- sections ---------------- */

function ScrollBar() {
  const { scrollYProgress } = useScroll();
  const scaleX = useSpring(scrollYProgress, { stiffness: 120, damping: 30 });
  return html`<${motion.div} className="fixed top-0 left-0 right-0 h-[2px] gold-fill origin-left z-50" style=${{ scaleX }} />`;
}

function HeroPyramid({ y }) {
  const draw = (delay, dur = 2.4) => ({
    initial: { pathLength: 0, opacity: 0 },
    animate: { pathLength: 1, opacity: 1 },
    transition: { pathLength: { duration: dur, ease: [0.6, 0, 0.2, 1], delay }, opacity: { duration: 0.3, delay } },
  });
  return html`<${motion.svg} style=${{ y, x: "-50%" }} viewBox="0 0 800 420" fill="none" aria-hidden="true"
      className="absolute bottom-0 left-1/2 w-[150%] sm:w-[110%] max-w-[1200px] opacity-60 pointer-events-none">
    <defs>
      <radialGradient id="sun"><stop offset="0" stop-color="#F5E3AE" stop-opacity=".45"/><stop offset=".55" stop-color="#D9B868" stop-opacity=".1"/><stop offset="1" stop-color="#D9B868" stop-opacity="0"/></radialGradient>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><path d="M0 0v6" stroke="#D9B868" stroke-width=".6" opacity=".35"/></pattern>
      <linearGradient id="fadeUp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9B868"/><stop offset="1" stop-color="#D9B868" stop-opacity=".15"/></linearGradient>
    </defs>
    <${motion.circle} cx="400" cy="150" r="170" fill="url(#sun)"
      initial=${{ opacity: 0, scale: 0.6 }} animate=${{ opacity: 1, scale: 1 }} transition=${{ duration: 2.5, ease: EASE, delay: 0.6 }} />
    <${motion.circle} cx="400" cy="150" r="64" stroke="#D9B868" stroke-width=".8" ...${draw(0.9, 2)} />
    <g stroke="url(#fadeUp)" stroke-width="1">
      <${motion.path} d="M400 70 170 400 460 412Z" fill="#0A0908" ...${draw(0.2)} />
      <${motion.path} d="M400 70 630 400 460 412" fill="url(#hatch)" ...${draw(0.4)} />
      <${motion.path} d="M400 70 460 412" ...${draw(0.6)} />
      <${motion.path} d="M120 404H680" stroke-width=".6" ...${draw(1.2, 1.6)} />
    </g>
  <//>`;
}

function Hero() {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end start'] });
  const contentY = useTransform(scrollYProgress, [0, 1], [0, 180]);
  const contentO = useTransform(scrollYProgress, [0, 0.7], [1, 0]);
  const pyrY = useTransform(scrollYProgress, [0, 1], [0, -80]);

  const mx = useMotionValue(50), my = useMotionValue(35);
  const sx = useSpring(mx, { stiffness: 50, damping: 20 }), sy = useSpring(my, { stiffness: 50, damping: 20 });
  const spot = useMotionTemplate`radial-gradient(700px circle at ${sx}% ${sy}%, rgba(217,184,104,.13), transparent 60%)`;
  const onMove = e => {
    const r = e.currentTarget.getBoundingClientRect();
    mx.set(((e.clientX - r.left) / r.width) * 100); my.set(((e.clientY - r.top) / r.height) * 100);
  };

  return html`<section ref=${ref} onPointerMove=${onMove}
      className="relative min-h-[100svh] flex flex-col items-center justify-center overflow-hidden px-4">
    <${motion.div} className="absolute inset-0" style=${{ background: spot }} aria-hidden="true" />
    <div className="absolute inset-0 grid-bg" aria-hidden="true"></div>
    <${HeroPyramid} y=${pyrY} />
    <div className="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-[var(--bg)] to-transparent" aria-hidden="true"></div>

    <${motion.div} style=${{ y: contentY, opacity: contentO }} className="relative z-10 text-center -mt-16 sm:-mt-24">
      <${motion.p} className="eyebrow" initial=${{ opacity: 0, letterSpacing: '.6em' }} animate=${{ opacity: 1, letterSpacing: '.22em' }}
        transition=${{ duration: 1.6, ease: EASE }}>Nunta · Lista invitaților<//>

      <h1 className="mt-8 font-display font-light leading-[.9] tracking-[.1em] text-[clamp(2.9rem,10.5vw,8.5rem)]">
        <${Letters} text="SORIN" delay=${0.2} className="block justify-center" />
        <${motion.span} className="block font-display italic font-light text-[.42em] tracking-normal my-2 sm:my-3"
          style=${{ color: 'var(--gold)' }}
          initial=${{ opacity: 0, scale: 0.4, rotate: -20 }} animate=${{ opacity: 1, scale: 1, rotate: 0 }}
          transition=${{ type: 'spring', stiffness: 120, damping: 12, delay: 0.75 }}>&<//>
        <${Letters} text="ANDREEA" delay=${0.9} className="block justify-center" />
      </h1>

      <${motion.div} initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} transition=${{ delay: 1.6, duration: 1 }}>
        <${Wave} className="mt-10 mx-auto max-w-[260px]" />
      <//>

      <${motion.p} className="mt-8 font-mono text-[.78rem] sm:text-sm text-muted"
        initial=${{ opacity: 0, y: 10 }} animate=${{ opacity: 1, y: 0 }} transition=${{ delay: 2, duration: 0.8 }}>
        <span style=${{ color: 'var(--gold)' }}>❯ </span><${Typed} text='sorin.commit("andreea", { forever: true })' delay=${2.3} />
      <//>
    <//>

    <${motion.a} href="#invitati" aria-label="Mergi la invitați"
      className="absolute bottom-8 z-10 grid place-items-center w-11 h-11 rounded-full border border-line text-gold hover:border-[var(--gold)] transition-colors"
      initial=${{ opacity: 0 }} animate=${{ opacity: 1, y: [0, 8, 0] }}
      transition=${{ opacity: { delay: 2.6 }, y: { repeat: Infinity, duration: 2, ease: 'easeInOut', delay: 2.6 } }}>
      <${Icon} name="down" size=${16} />
    <//>
  </section>`;
}

function SectionTitle({ n, kicker, title }) {
  return html`<${Reveal} className="text-center">
    <p className="eyebrow">${n} — ${kicker}</p>
    <h2 className="mt-4 font-display font-light text-4xl sm:text-6xl tracking-wide">${title}</h2>
  <//>`;
}

function ConfirmPyramid({ pct }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: '-60px' });
  const h = 196 * pct;
  return html`<svg ref=${ref} viewBox="0 0 240 210" className="w-48 sm:w-60 h-auto" aria-hidden="true">
    <defs>
      <clipPath id="pyrClip"><path d="M120 6 234 204H6Z"/></clipPath>
      <linearGradient id="pyrGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5E3AE"/><stop offset=".6" stop-color="#D9B868"/><stop offset="1" stop-color="#9A7A30"/></linearGradient>
    </defs>
    <g clipPath="url(#pyrClip)">
      <rect width="240" height="210" fill="#131110" />
      <${motion.rect} x="0" width="240" fill="url(#pyrGold)"
        initial=${{ y: 204, height: 0 }} animate=${inView ? { y: 204 - h, height: h } : {}}
        transition=${{ duration: 2, ease: EASE, delay: 0.3 }} />
    </g>
    <${motion.path} d="M120 6 234 204H6Z" fill="none" stroke="#D9B868" stroke-width="1.2"
      initial=${{ pathLength: 0 }} animate=${inView ? { pathLength: 1 } : {}} transition=${{ duration: 1.6, ease: EASE }} />
    <path d="M120 6V204" stroke="#D9B868" stroke-width=".5" opacity=".4" />
  </svg>`;
}

function Numbers({ guests }) {
  const invited = guests.length, comp = sum(guests, 'companions'), kids = sum(guests, 'kids');
  const total = invited + comp, conf = guests.filter(g => g.confirmed).length;
  const pct = total ? conf / total : 0;
  const stats = [
    ['Invitați', invited], ['Însoțitori', comp], ['Copii mici', kids], ['Total persoane', total],
  ];
  return html`<section className="mx-auto max-w-6xl px-4 sm:px-8 py-28 sm:py-36">
    <${SectionTitle} n="01" kicker="În cifre" title="Cei dragi nouă" />

    <div className="mt-20 grid grid-cols-2 lg:grid-cols-4 border-y border-line">
      ${stats.map(([label, v], i) => html`
        <${Reveal} key=${label} delay=${i * 0.1}
          className=${'py-10 sm:py-14 text-center ' + (i % 2 ? 'border-l border-line ' : '') + (i === 2 ? 'lg:border-l ' : '') + (i < 2 ? 'border-b lg:border-b-0 border-line' : '')}>
          <${Counter} value=${v} className="block font-display font-light text-6xl sm:text-7xl gold" />
          <p className="mt-3 text-[.7rem] sm:text-xs tracking-[.25em] uppercase text-muted">${label}</p>
        <//>`)}
    </div>

    <div className="mt-24 grid md:grid-cols-[auto_1fr] gap-10 sm:gap-16 items-center justify-items-center md:justify-items-start">
      <${ConfirmPyramid} pct=${pct} />
      <${Reveal} className="text-center md:text-left">
        <p className="eyebrow">Prezență confirmată</p>
        <p className="mt-3 font-display font-light text-7xl sm:text-8xl leading-none"><${Counter} value=${Math.round(pct * 100)} className="gold" /><span className="gold">%</span></p>
        <p className="mt-5 text-lg text-muted max-w-sm">
          <span className="text-ink">${conf}</span> din <span className="text-ink">${total}</span> invitați și-au confirmat deja prezența. Piramida se umple pe măsură ce vin confirmările.
        </p>
      <//>
    </div>
  </section>`;
}

function Groups({ guests, onPick }) {
  return html`<section className="mx-auto max-w-4xl px-4 sm:px-8 pb-28 sm:pb-36">
    <${SectionTitle} n="02" kicker="Grupuri" title="Cine ne e alături" />
    <ul className="mt-16">
      ${groupsOf(guests).map(([name, list], i) => {
        const people = list.length + sum(list, 'companions');
        const conf = list.filter(g => g.confirmed).length;
        const pct = people ? conf / people : 0;
        return html`<${motion.li} key=${name}
          initial=${{ opacity: 0, x: -30 }} whileInView=${{ opacity: 1, x: 0 }} viewport=${{ once: true, margin: '-40px' }}
          transition=${{ duration: 0.8, ease: EASE, delay: i * 0.08 }}>
          <button onClick=${() => onPick(name)} className="group w-full text-left py-7 border-b border-line flex items-center gap-5 sm:gap-8 cursor-pointer">
            <span className="font-mono text-xs text-muted w-6">0${i + 1}</span>
            <div className="flex-1 min-w-0">
              <div className="flex items-baseline justify-between gap-4">
                <span className="font-display text-2xl sm:text-3xl group-hover:text-[var(--gold)] transition-colors duration-300">${name}</span>
                <span className="font-display text-3xl sm:text-4xl font-light gold tabular-nums">${people}</span>
              </div>
              <div className="mt-3 h-px bg-[var(--line)] relative overflow-hidden">
                <${motion.span} className="absolute inset-y-0 left-0 w-full gold-fill origin-left"
                  initial=${{ scaleX: 0 }} whileInView=${{ scaleX: pct }} viewport=${{ once: true }}
                  transition=${{ duration: 1.6, ease: EASE, delay: 0.3 + i * 0.08 }} />
              </div>
              <p className="mt-2 text-xs text-muted">${list.length} invitați · ${sum(list, 'companions')} însoțitori · ${sum(list, 'kids')} copii · <span className="text-ok">${conf} confirmați</span></p>
            </div>
            <span className="text-gold opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300" aria-hidden="true">→</span>
          </button>
        <//>`;
      })}
    </ul>
  </section>`;
}

function Segmented({ options, value, onChange, id, label }) {
  return html`<div role="group" aria-label=${label} className="flex gap-1 p-1 rounded-full border border-line bg-[var(--surface)] w-max">
    ${options.map(([k, text]) => html`
      <button key=${k} onClick=${() => onChange(k)} aria-pressed=${value === k}
        className=${'relative min-h-[40px] px-4 sm:px-5 rounded-full text-xs tracking-[.12em] uppercase whitespace-nowrap cursor-pointer transition-colors duration-300 ' + (value === k ? 'text-[var(--bg)]' : 'text-muted hover:text-ink')}>
        ${value === k && html`<${motion.span} layoutId=${id} className="absolute inset-0 rounded-full gold-fill" transition=${{ type: 'spring', stiffness: 380, damping: 32 }} />`}
        <span className="relative">${text}</span>
      </button>`)}
  </div>`;
}

function Chip({ tone, icon, children }) {
  const tones = {
    ok: 'text-ok border-[color-mix(in_srgb,var(--ok)_35%,transparent)] bg-[color-mix(in_srgb,var(--ok)_8%,transparent)]',
    gold: 'text-gold border-[color-mix(in_srgb,var(--gold)_35%,transparent)] bg-[color-mix(in_srgb,var(--gold)_8%,transparent)]',
    mute: 'text-muted border-line',
  };
  return html`<span className=${'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[.68rem] tracking-[.06em] uppercase whitespace-nowrap ' + tones[tone]}>
    ${icon && html`<${Icon} name=${icon} size=${11} />`}${children}
  </span>`;
}

function Guests({ guests, live, group, setGroup }) {
  const [status, setStatus] = useState('all');
  const [q, setQ] = useState('');
  const dq = useDeferredValue(q);

  const list = useMemo(() => {
    const nq = norm(dq.trim());
    return guests.filter(g =>
      (group === 'all' || g.group === group) &&
      (status === 'all' || (status === 'yes') === g.confirmed) &&
      (!nq || norm(g.name + ' ' + g.note).includes(nq)));
  }, [guests, group, status, dq]);

  const groupOpts = [['all', 'Toate'], ...groupsOf(guests).map(([n]) => [n, n])];

  return html`<section id="invitati" className="mx-auto max-w-6xl px-4 sm:px-8 pb-32 scroll-mt-4">
    <${SectionTitle} n="03" kicker="Invitați" title="Lista de invitați" />

    <div className="mt-14 sticky top-3 z-30 rounded-[28px] border border-line p-3 sm:p-4 backdrop-blur-xl"
         style=${{ background: 'color-mix(in srgb, var(--surface) 85%, transparent)' }}>
      <div className="flex flex-col lg:flex-row gap-3 lg:items-center">
        <label className="relative flex-1">
          <span className="sr-only">Caută invitat</span>
          <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gold"><${Icon} name="search" size=${16} /></span>
          <input type="search" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Caută după nume…" autoComplete="off"
            className="w-full min-h-[48px] rounded-full border border-line bg-[var(--bg)] pl-11 pr-4 text-base text-ink placeholder:text-muted focus:outline-none focus:border-[var(--gold)] transition-colors" />
        </label>
        <${Segmented} id="status-pill" label="Filtru status" value=${status} onChange=${setStatus}
          options=${[['all', 'Toți'], ['yes', 'Confirmați'], ['no', 'În așteptare']]} />
      </div>
      <div className="mt-3 overflow-x-auto scroller">
        <${Segmented} id="group-pill" label="Filtru grup" value=${group} onChange=${setGroup} options=${groupOpts} />
      </div>
    </div>

    <div className="mt-8 flex items-center justify-between gap-4 text-xs text-muted" aria-live="polite">
      <span><span className="text-ink">${list.length}</span> invitați · <span className="text-ink">${list.length + sum(list, 'companions')}</span> persoane cu însoțitori</span>
      ${live !== null && html`<span className="inline-flex items-center gap-2">
        <span className="relative flex w-2 h-2">
          ${live && html`<span className="absolute inset-0 rounded-full bg-[var(--ok)] animate-ping opacity-60"></span>`}
          <span className=${'relative w-2 h-2 rounded-full ' + (live ? 'bg-[var(--ok)]' : 'bg-[var(--gold)]')}></span>
        </span>
        ${live ? 'Live din Google Sheets' : 'Date salvate'}
      </span>`}
    </div>

    <${motion.ul} layout className="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <${AnimatePresence} mode="popLayout">
        ${list.map((g, i) => html`
          <${motion.li} key=${g.id} layout
            initial=${{ opacity: 0, scale: 0.92, y: 20 }} animate=${{ opacity: 1, scale: 1, y: 0 }}
            exit=${{ opacity: 0, scale: 0.92, transition: { duration: 0.2 } }}
            transition=${{ type: 'spring', stiffness: 260, damping: 26, delay: Math.min(i, 15) * 0.025 }}
            whileHover=${{ y: -4 }}
            className="group relative rounded-[22px] border border-line bg-[var(--surface)] p-5 flex gap-5 items-center overflow-hidden hover:border-[color-mix(in_srgb,var(--gold)_55%,transparent)] transition-colors duration-300">
            <span className="pointer-events-none absolute -top-16 -right-16 w-40 h-40 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-500"
                  style=${{ background: 'radial-gradient(circle, rgba(217,184,104,.18), transparent 70%)' }} aria-hidden="true"></span>
            <span className=${'cartouche shrink-0 ' + (g.confirmed ? 'on gold-fill' : '')} aria-hidden="true">${initials(g.name)}</span>
            <div className="min-w-0 relative">
              <p className="font-display text-xl leading-tight">${g.name}</p>
              ${g.note && html`<p className="font-mono text-[.7rem] text-muted mt-0.5">// ${g.note}</p>`}
              <div className="mt-2.5 flex flex-wrap gap-1.5">
                ${g.confirmed ? html`<${Chip} tone="ok" icon="check">Confirmat<//>` : html`<${Chip} tone="mute">În așteptare<//>`}
                ${g.companions > 0 && html`<${Chip} tone="gold" icon="plus">${g.companions} însoțit${g.companions > 1 ? 'ori' : 'or'}<//>`}
                ${g.kids > 0 && html`<${Chip} tone="gold" icon="child">${g.kids} cop${g.kids > 1 ? 'ii' : 'il'}<//>`}
                ${g.sent && html`<${Chip} tone="gold" icon="mail">Invitație trimisă<//>`}
              </div>
            </div>
          <//>`)}
      <//>
    <//>

    <${AnimatePresence}>
      ${list.length === 0 && html`<${motion.div} key="empty" initial=${{ opacity: 0, y: 10 }} animate=${{ opacity: 1, y: 0 }} exit=${{ opacity: 0 }}
        className="mt-6 rounded-[22px] border border-line p-12 text-center">
        <p className="font-display text-3xl">Niciun invitat găsit</p>
        <p className="mt-2 text-muted">Încearcă alt nume sau alt filtru.</p>
      <//>`}
    <//>
  </section>`;
}

function Footer() {
  return html`<footer className="border-t border-line">
    <div className="mx-auto max-w-6xl px-4 sm:px-8 py-16 text-center">
      <p className="font-display font-light text-4xl sm:text-5xl tracking-[.14em] gold">SORIN & ANDREEA</p>
      <${Wave} bars=${24} className="mt-8 mx-auto max-w-[160px] h-6 opacity-70" />
      <a href="../" className="mt-10 inline-flex items-center gap-2 min-h-[44px] px-5 rounded-full border border-line text-sm text-muted hover:text-ink hover:border-[var(--gold)] transition-colors">
        Vezi varianta arhitecturală <span aria-hidden="true">→</span>
      </a>
    </div>
  </footer>`;
}

function App() {
  const { guests, live } = useGuests();
  const [group, setGroup] = useState('all');
  const pick = name => {
    setGroup(name);
    document.getElementById('invitati')?.scrollIntoView({ behavior: 'smooth' });
  };
  return html`<${MotionConfig} reducedMotion="user">
    <${ScrollBar} />
    <${Hero} />
    ${guests.length > 0 && html`
      <${Numbers} guests=${guests} />
      <${Groups} guests=${guests} onPick=${pick} />
      <${Guests} guests=${guests} live=${live} group=${group} setGroup=${setGroup} />`}
    <${Footer} />
  <//>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
